name: Public site checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-site:
    name: Verify static site source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out public site source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate local pages, navigation, sitemap and search verification
        run: python3 scripts/check_site.py
      - name: Check page weight and public asset budgets
        run: python3 scripts/check_performance_budget.py
